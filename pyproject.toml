[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "risex-python-sdk"
version = "0.1.0a3.dev0"
description = "Independent asynchronous Python client for RISEx REST and WebSocket APIs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "loinsssss" }]
requires-python = ">=3.11"
dependencies = [
    "eth-account>=0.13,<0.14",
    "eth-abi>=5,<6",
    "eth-utils>=5,<7",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "websockets>=14,<16",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.urls]
Repository = "https://github.com/loinsssss/risex-python-sdk"
Issues = "https://github.com/loinsssss/risex-python-sdk/issues"
Documentation = "https://github.com/loinsssss/risex-python-sdk/blob/main/docs/developer-guide.md"

[tool.hatch.build.targets.wheel]
packages = ["src/risex"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests",
    "/examples/account_reads.py", "/examples/order_lifecycle.py",
    "/examples/account_fees.py",
    "/examples/private_stream.py", "/examples/public_rest.py",
    "/examples/public_stream.py", "/examples/register_signer.py",
    "/docs/api-contracts.md", "/docs/api-reference.md",
    "/docs/developer-guide.md", "/docs/testnet-integration.md",
    "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/SECURITY.md", "/pyproject.toml",
    "/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: explicit opt-in public or funded network checks"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/risex"]
